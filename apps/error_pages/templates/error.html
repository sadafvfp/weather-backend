{% load i18n %}
<!doctype html>
<html lang="{{ lang }}" dir="{% if LANGUAGE_BIDI %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }}{% if title %} - {{ title }}{% endif %}</title>
  <meta name="robots" content="noindex,follow">
  <style>
    :root {
      --bg: #f7f9fb;
      --ink: #16202a;
      --muted: #5f6f7d;
      --line: #d9e2ea;
      --panel: #ffffff;
      --primary: #137c80;
      --primary-strong: #0f6669;
      --accent: #d64b3c;
      --shadow: 0 18px 48px rgba(26, 45, 64, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 32px 18px;
      background:
        linear-gradient(135deg, rgba(19, 124, 128, 0.12), transparent 36%),
        linear-gradient(315deg, rgba(214, 75, 60, 0.10), transparent 34%),
        var(--bg);
      color: var(--ink);
      font-family: {% if LANGUAGE_BIDI %}Tahoma, {% endif %}-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    .error-page {
      width: min(100%, 980px);
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(260px, 0.95fr);
      overflow: hidden;
      border: 1px solid rgba(217, 226, 234, 0.9);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .copy,
    .status-panel {
      padding: clamp(28px, 5vw, 56px);
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 11ch;
      font-size: clamp(2.2rem, 6vw, 4.7rem);
      line-height: 1.02;
      letter-spacing: 0;
    }

    .message {
      max-width: 54ch;
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.12rem);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .button {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 10px 16px;
      color: #fff;
      background: var(--primary);
      font-weight: 750;
      text-decoration: none;
    }

    .button:hover,
    .button:focus {
      background: var(--primary-strong);
    }

    .button.secondary {
      color: var(--ink);
      border-color: var(--line);
      background: #fff;
    }

    .button.secondary:hover,
    .button.secondary:focus {
      background: #f2f6f8;
    }

    .button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .status-panel {
      display: grid;
      align-content: center;
      min-height: 420px;
      border-inline-start: 1px solid var(--line);
      background:
        linear-gradient(180deg, rgba(22, 32, 42, 0.04), transparent),
        #fbfcfd;
    }

    .status-code {
      margin: 0;
      color: var(--accent);
      font-size: clamp(5.6rem, 15vw, 10rem);
      font-weight: 850;
      line-height: 0.9;
      letter-spacing: 0;
    }

    .diagnostic {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.92rem;
    }

    .diagnostic span {
      display: block;
      color: var(--ink);
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    @media (max-width: 760px) {
      body {
        display: block;
        padding: 18px;
      }

      .error-page {
        grid-template-columns: 1fr;
      }

      .status-panel {
        min-height: auto;
        border-inline-start: 0;
        border-top: 1px solid var(--line);
      }

      .actions {
        flex-direction: column;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="error-page" aria-labelledby="error-title">
    <section class="copy">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1 id="error-title">{{ title }}</h1>
      <p class="message">{{ message }}</p>

      <div class="actions" aria-label="{% trans 'Recovery actions' %}">
        <a class="button" href="{{ site_url }}">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.8 12 3l9 7.8V21a1 1 0 0 1-1 1h-5.4v-6.2H9.4V22H4a1 1 0 0 1-1-1V10.8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
          {% trans "Go home" %}
        </a>
        <a class="button secondary" href="javascript:history.back()">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M11 6 5 12l6 6M5.8 12H20" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {% trans "Go back" %}
        </a>
      </div>
    </section>

    <aside class="status-panel" aria-label="{% trans 'Error details' %}">
      <p class="status-code">{{ status }}</p>
      <div class="diagnostic">
        {% trans "Requested path" %}
        <span>{{ request_path }}</span>
      </div>
    </aside>
  </main>
</body>
</html>
